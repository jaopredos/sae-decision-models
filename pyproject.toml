[project]
name = "trabalho-final-nlp-e0"
version = "0.1.0"
description = "E0 - Diagnostico comportamental de vieses em modelos de decisao (Laya multilingual x Julia-1)"
requires-python = ">=3.12"
dependencies = [
    "torch==2.15.0",
    "numpy==2.5.4",
    "pandas==3.1.1",
    "scipy==1.18.1",
    "scikit-learn==1.9.1",
    "matplotlib==3.11.2",
    "huggingface-hub==1.33.0",
    "transformers==5.22.2",
    "datasets==5.1.0",
    "pyarrow==26.0.1",
    "safetensors==0.8.0",
    "laya==0.4.30",
]

[tool.uv]
package = false

# torch 2.15.0 nos dois lados: no Linux (cluster sauron, B200/Blackwell) vem do índice CUDA 13.2
# do PyTorch; no Mac vem do PyPI (CPU/MPS). O índice cu132 só publica cp313/cp314, daí o
# .python-version em 3.14.
[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu132", marker = "sys_platform == 'linux'" }]
