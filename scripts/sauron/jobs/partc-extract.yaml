# Parte C completo: marcadores em todas as camadas (base 512/192, base 1024/256, fine-tuned 1024/256) e probes por camada no base. Só depois do curto.
#
#   sauron submit -c scripts/sauron/jobs/partc-extract.yaml scripts/sauron/partc_extract.sauron

name: sae-partc-extract
image: pytorch/pytorch:2.13.0-cuda13.0-cudnn9-devel
gpus: 1
vram: 89
# 1ª ESTIMATIVA (nenhuma medida ainda para este job); reajustar pelo pico medido (pico / 0,7).
memory: 10g
cpus: 4
max_time: 1h

workspace: sae-decision-models

env:
  LIMIT: "0"
  PIP_FREEZE_OUT: "results/sae_features/pip_freeze.txt"
