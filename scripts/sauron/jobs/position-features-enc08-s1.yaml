# Ablação das features de maior η² de posição em enc_08, SAE de semente 1 (emenda 8, E5).
#
#   sauron submit -f scripts/sauron/jobs/position-features-enc08-s1.yaml

name: position-features-enc08-s1
image: pytorch/pytorch:2.13.0-cuda13.0-cudnn9-devel
gpus: 1
vram: 89
# Medido no job 4584 (mesma carga): pico 2,4 GiB; 4g.
memory: 4g
cpus: 4
max_time: 1h

workspace: sae-decision-models

env:
  SAE: "ml_enc08_k32_s1"
  LAYER: "enc_08"
  PIP_FREEZE_OUT: "results/sae_features/pip_freeze.txt"
script: ../position_features.sauron
