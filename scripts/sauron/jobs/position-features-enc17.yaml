# Ablação das features de maior eta^2 de posição em enc_17, SAE de semente 0 (emenda 7).
#
#   sauron submit -c scripts/sauron/jobs/position-features-enc17.yaml scripts/sauron/position_features.sauron

name: position-features-enc17
image: pytorch/pytorch:2.13.0-cuda13.0-cudnn9-devel
gpus: 1
vram: 89
# 1ª ESTIMATIVA (nenhuma medida ainda): idem ao position-features-enc08.
memory: 5g
cpus: 4
max_time: 1h

workspace: sae-decision-models

env:
  SAE: "ml_enc17_k32"
  LAYER: "enc_17"
  PIP_FREEZE_OUT: "results/sae_features/pip_freeze.txt"
