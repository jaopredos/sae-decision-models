# Treino completo do SAE TopK (k=32, 16x hidden) em enc_17: 50M tokens, 10% domínio (PROTOCOLO.md, emenda 1).
# Só depois de o sae-train-smoke passar. Em enc_17 os tokens massivos são excluídos pela regra de 5x a mediana.
#
#   sauron submit -c scripts/sauron/jobs/sae-train-enc17.yaml scripts/sauron/sae_train.sauron

name: sae-train-enc17
image: pytorch/pytorch:2.13.0-cuda13.0-cudnn9-devel
gpus: 1
vram: 89
# 1ª ESTIMATIVA (reajustar pelo pico do sae-train-smoke).
memory: 8g
cpus: 4
max_time: 3h

workspace: sae-decision-models

env:
  LAYER: "enc_17"
  NAME: "ml_enc17_k32"
  TOTAL_TOKENS: "50000000"
  EXTRA_ARGS: "--resume"
  PIP_FREEZE_OUT: "results/sae_features/pip_freeze.txt"
