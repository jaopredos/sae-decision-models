# Atribuição por gradiente e estatísticas de features do SAE de semente 1 em enc_08 (sem cartões), para a estabilidade da lista e a ablação com a semente 1.
#
#   sauron submit -c scripts/sauron/jobs/features-enc08-s1.yaml scripts/sauron/features.sauron

name: features-enc08-s1
image: pytorch/pytorch:2.13.0-cuda13.0-cudnn9-devel
gpus: 1
vram: 89
# Medido: features de enc_08, semente 0, pico 4,3 GiB (com atribuição); 4,3 / 0,7 = 6,1 -> 6g.
memory: 6g
cpus: 4
max_time: 1h

workspace: sae-decision-models

env:
  LAYER: "enc_08"
  NAME: "ml_enc08_k32_s1"
  SKIP_CARDS: "1"
  PIP_FREEZE_OUT: "results/sae_features/pip_freeze.txt"
