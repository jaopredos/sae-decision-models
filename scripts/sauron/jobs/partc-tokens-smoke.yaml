# Parte C, job CURTO: todos os tokens de uma camada (enc_20, só para exercitar o encanamento) do base e do fine-tuned, 20 casos.
#
#   sauron submit -c scripts/sauron/jobs/partc-tokens-smoke.yaml scripts/sauron/partc_tokens.sauron

name: sae-partc-tokens-smoke
image: pytorch/pytorch:2.13.0-cuda13.0-cudnn9-devel
gpus: 1
vram: 89
# 1ª ESTIMATIVA (nenhuma medida ainda para este job); reajustar pelo pico medido (pico / 0,7).
memory: 8g
cpus: 4
max_time: 30m

workspace: sae-decision-models

env:
  LIMIT: "20"
  LAYER: "enc_20"
  PIP_FREEZE_OUT: "results/sae_features/pip_freeze.txt"
