# Parte C: comparação base x fine-tuned (entradas idênticas, FVE do SAE do base no fine-tuned, diferenças por feature com bootstrap pareado por caso).
#
#   sauron submit -c scripts/sauron/jobs/partc-compare.yaml scripts/sauron/partc_compare.sauron

name: partc-compare
image: pytorch/pytorch:2.13.0-cuda13.0-cudnn9-devel
gpus: 1
vram: 89
# 1ª ESTIMATIVA (nenhuma medida): duas visões de ~28 mil marcadores x 16.384 latentes, 8g.
memory: 8g
cpus: 4
max_time: 1h

workspace: sae-decision-models

env:
  LAYER: "enc_17"
  NAME: "en_base_enc17_k32"
  ATTR_BASE: "results/sae_features/en_base_enc17_k32"
  ATTR_FT: "results/sae_features/en_ft_enc17_k32"
  PIP_FREEZE_OUT: "results/sae_features/pip_freeze.txt"
