# Rodada LITERAL (protocolo original, todos os tokens, sem exclusão de massivos) em enc_17, para mostrar o efeito
# da emenda 1. Mesmo orçamento e sementes do sae-train-enc17.
#
#   sauron submit -c scripts/sauron/jobs/sae-train-enc17-literal.yaml scripts/sauron/sae_train.sauron

name: sae-train-enc17-literal
image: pytorch/pytorch:2.13.0-cuda13.0-cudnn9-devel
gpus: 1
vram: 89
# 1ª ESTIMATIVA (reajustar pelo pico do sae-train-smoke).
memory: 8g
cpus: 4
max_time: 3h

workspace: sae-decision-models

env:
  LAYER: "enc_17"
  NAME: "ml_enc17_k32_literal"
  TOTAL_TOKENS: "50000000"
  MASSIVE_MULT: "inf"
  EXTRA_ARGS: "--resume"
  PIP_FREEZE_OUT: "results/sae_features/pip_freeze.txt"
