# Subespaço de posição depois da camada 22 e combinações de camadas (emenda 8, E4).
#
#   sauron submit -f scripts/sauron/jobs/position-tail.yaml

name: position-tail
image: pytorch/pytorch:2.13.0-cuda13.0-cudnn9-devel
gpus: 1
vram: 89
# Medido (job 4621): pico 2,5 GiB; 2,5 / 0,7 = 3,6 -> 4g. Duração 33 min (dev 15 min, teste 17 min).
memory: 4g
cpus: 4
max_time: 2h

workspace: sae-decision-models

env:
  PIP_FREEZE_OUT: "results/sae_features/pip_freeze.txt"
script: ../position_tail.sauron
