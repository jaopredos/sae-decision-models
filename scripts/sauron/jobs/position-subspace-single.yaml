# Remoção do subespaço de posição só na camada L (emenda 7), dev e teste.
#
#   sauron submit -f scripts/sauron/jobs/position-subspace-single.yaml   (script: relativo à pasta do YAML; ver a nota no fim)

name: position-subspace-single
image: pytorch/pytorch:2.13.0-cuda13.0-cudnn9-devel
gpus: 1
vram: 89
# Medido (job 4582): pico 4,7 GiB (estimativa dos subespaços das 22 camadas); 4,7 / 0,7 = 6,7 -> 7g. Duração 45 min.
memory: 7g
cpus: 4
max_time: 3h

workspace: sae-decision-models

env:
  MODES: "single"
  PIP_FREEZE_OUT: "results/sae_features/pip_freeze.txt"
# O `script:` é resolvido a partir da pasta do YAML. Na CLI 0.35 o `-c` não existe: o comando é `sauron submit -f <yaml>`.
# Para enviar daqui sem copiar o script, passe o caminho absoluto: script: ~/workspace/sae-decision-models/scripts/sauron/position_subspace.sauron
script: ../position_subspace.sauron
