# Marcadores massivos x escolha do modelo, no base e no fine-tuned em inglês (enc_17).
#
#   sauron submit -c scripts/sauron/jobs/massive-markers.yaml scripts/sauron/massive.sauron

name: massive-markers
image: pytorch/pytorch:2.13.0-cuda13.0-cudnn9-devel
gpus: 1
vram: 89
# 1ª ESTIMATIVA (nenhuma medida ainda): lê 28 mil vetores de marcadores por modelo, mas o memmap dos tokens
# passa pelo page cache. 6g.
memory: 6g
cpus: 4
max_time: 30m

workspace: sae-decision-models

env:
  PIP_FREEZE_OUT: "results/sae_features/pip_freeze.txt"
