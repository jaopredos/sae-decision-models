# Qualidade e fidelidade a jusante da variante k=64 de enc_17.
#
#   sauron submit -c scripts/sauron/jobs/sae-quality-enc17-k64.yaml scripts/sauron/sae_quality.sauron

name: sae-quality-enc17-k64
image: pytorch/pytorch:2.13.0-cuda13.0-cudnn9-devel
gpus: 1
vram: 89
# Medido: sae-quality enc_08 (3619) pico 3,8 GiB e enc_17 (3621) 4,0 GiB; 4,0 / 0,7 = 5,7 -> 6g.
memory: 6g
cpus: 4
max_time: 1h

workspace: sae-decision-models

env:
  LAYER: "enc_17"
  NAME: "ml_enc17_k64"
  PIP_FREEZE_OUT: "results/sae_features/pip_freeze.txt"
