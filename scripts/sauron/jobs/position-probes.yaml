# Sondas de posição, conteúdo e resposta sobre os vetores de rotação (emenda 7), 25 camadas.
#
#   sauron submit -f scripts/sauron/jobs/position-probes.yaml   (script: relativo à pasta do YAML; ver a nota no fim)

name: position-probes
image: pytorch/pytorch:2.13.0-cuda13.0-cudnn9-devel
gpus: 1
vram: 89
# Medido (job 4581): pico 4,8 GiB de 5g (page cache incluso, no teto); 4,8 / 0,7 = 6,9 -> 7g para repetir. Duração 7 min.
memory: 7g
cpus: 4
max_time: 1h

workspace: sae-decision-models

env:
  PIP_FREEZE_OUT: "results/sae_features/pip_freeze.txt"
# O `script:` é resolvido a partir da pasta do YAML. Na CLI 0.35 o `-c` não existe: o comando é `sauron submit -f <yaml>`.
# Para enviar daqui sem copiar o script, passe o caminho absoluto: script: ~/workspace/sae-decision-models/scripts/sauron/position_probes.sauron
script: ../position_probes.sauron
