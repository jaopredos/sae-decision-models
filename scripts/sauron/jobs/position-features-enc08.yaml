# Ablação das features de maior eta^2 de posição em enc_08, SAE de semente 0 (emenda 7).
#
#   sauron submit -c scripts/sauron/jobs/position-features-enc08.yaml scripts/sauron/position_features.sauron

name: position-features-enc08
image: pytorch/pytorch:2.13.0-cuda13.0-cudnn9-devel
gpus: 1
vram: 89
# 1ª ESTIMATIVA (nenhuma medida ainda): ablação anterior (pico de 2,2 a 2,7 GiB) mais os vetores da camada (127 MB) na seleção das features.
memory: 5g
cpus: 4
max_time: 1h

workspace: sae-decision-models

env:
  SAE: "ml_enc08_k32"
  LAYER: "enc_08"
  PIP_FREEZE_OUT: "results/sae_features/pip_freeze.txt"
