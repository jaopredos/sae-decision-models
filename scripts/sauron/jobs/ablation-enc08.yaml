# Ablação causal em enc_08 (SAE ml_enc08_k32), dev e teste, PROTOCOLO.md emenda 4.
#
#   sauron submit -c scripts/sauron/jobs/ablation-enc08.yaml scripts/sauron/ablation.sauron

name: ablation-enc08
image: pytorch/pytorch:2.13.0-cuda13.0-cudnn9-devel
gpus: 1
vram: 89
# 1ª ESTIMATIVA (nenhuma medida ainda para este job; qualidade do mesmo SAE teve pico de 3,8 a 4,0 GiB): 6g.
memory: 6g
cpus: 4
# ~700 condições por subconjunto, cada uma ~4 forwards em lote; estimativa sem medida.
max_time: 3h

workspace: sae-decision-models

env:
  LAYER: "enc_08"
  NAME: "ml_enc08_k32"
  PIP_FREEZE_OUT: "results/sae_features/pip_freeze.txt"
