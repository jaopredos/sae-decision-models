# Qualidade de um SAE e fidelidade a jusante no dev. Troque LAYER/NAME para cada SAE.
#
#   sauron submit -c scripts/sauron/jobs/sae-quality.yaml scripts/sauron/sae_quality.sauron

name: sae-quality
image: pytorch/pytorch:2.13.0-cuda13.0-cudnn9-devel
gpus: 1
vram: 89
# 1ª ESTIMATIVA.
memory: 8g
cpus: 4
max_time: 1h

workspace: sae-decision-models

env:
  LAYER: "enc_17"
  NAME: "ml_enc17_k32"
  PIP_FREEZE_OUT: "results/sae_features/pip_freeze.txt"
