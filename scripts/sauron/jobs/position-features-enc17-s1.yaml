# Ablação das features de maior η² de posição em enc_17, SAE de semente 1 (emenda 8, E5).
#
#   sauron submit -f scripts/sauron/jobs/position-features-enc17-s1.yaml

name: position-features-enc17-s1
image: pytorch/pytorch:2.13.0-cuda13.0-cudnn9-devel
gpus: 1
vram: 89
# Medido (job 4623): pico 2,4 GiB; 2,4 / 0,7 = 3,4 -> 4g. Duração 22 min.
memory: 4g
cpus: 4
max_time: 1h

workspace: sae-decision-models

env:
  SAE: "ml_enc17_k32_s1"
  LAYER: "enc_17"
  PIP_FREEZE_OUT: "results/sae_features/pip_freeze.txt"
script: ../position_features.sauron
