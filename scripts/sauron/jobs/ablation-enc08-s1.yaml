# Ablação causal com o SAE de semente 1 em enc_08 (PROTOCOLO.md, emenda 6, parte B, item iv): mesma receita das emendas 4 e 5.
#
#   sauron submit -c scripts/sauron/jobs/ablation-enc08-s1.yaml scripts/sauron/ablation.sauron

name: ablation-enc08-s1
image: pytorch/pytorch:2.13.0-cuda13.0-cudnn9-devel
gpus: 1
vram: 89
# Medido: ablation-enc08 pico 2,7 GiB e ablation-enc17 2,4 GiB; 2,7 / 0,7 = 3,9 -> 4g.
memory: 4g
cpus: 4
# Medido: ~14 min de dev e ~13 min de teste por camada; 1h dá folga.
max_time: 1h

workspace: sae-decision-models

env:
  LAYER: "enc_08"
  NAME: "ml_enc08_k32_s1"
  PIP_FREEZE_OUT: "results/sae_features/pip_freeze.txt"
