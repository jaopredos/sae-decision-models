# Segunda semente do SAE (PROTOCOLO.md, emenda 6, parte B): mesmo k = 32, orçamento e regra de massivos do SAE de semente 0; só muda a semente (inicialização e ordem dos dados).
#
#   sauron submit -c scripts/sauron/jobs/sae-train-enc08-s1.yaml scripts/sauron/sae_train.sauron

name: sae-train-enc08-s1
image: pytorch/pytorch:2.13.0-cuda13.0-cudnn9-devel
gpus: 1
vram: 89
# Medido: treinos de enc_08 com a semente 0 tiveram pico de 6,0 a 6,2 GiB; 6,2 / 0,7 = 8,9 -> 8g (como os k=64).
memory: 8g
cpus: 4
max_time: 1h

workspace: sae-decision-models

env:
  LAYER: "enc_08"
  NAME: "ml_enc08_k32_s1"
  TOTAL_TOKENS: "50000000"
  EXTRA_ARGS: "--resume --seed 1"
  PIP_FREEZE_OUT: "results/sae_features/pip_freeze.txt"
